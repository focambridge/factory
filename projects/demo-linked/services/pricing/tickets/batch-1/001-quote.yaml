schema_version: "1.2"
id: PRC-1
sequence: 1
title: Quote a price for a quantity of one product
description: >
  Add pricing.quote.quote(sku, quantity) and publish its result format as the
  quote contract.
type: feature

goal:
  problem: >
    Nothing in the system can price a product, so checkout has no way to total
    a basket.
  outcome: >
    quote(sku, quantity) returns a quote matching contracts/quote.schema.json,
    and raises KeyError for an unknown sku.

scope:
  in:
    - A pricing package with a quote function and a fixed price list
    - The quote contract as a JSON Schema
  out:
    - Discounts or currencies other than pence
    - Any HTTP interface
  affected_paths:
    - pricing/__init__.py
    - pricing/quote.py
    - contracts/quote.schema.json
    - tests/test_quote.py

technical:
  interfaces:
    - kind: function
      name: pricing.quote.quote
      signature: "(sku: str, quantity: int) -> dict"
      action: create
    - kind: schema
      name: quote
      action: create

acceptance_criteria:
  - id: AC-1
    given: the price list, where an apple costs 40 pence
    when: quote("apple", 3) is called
    then: it returns sku apple, quantity 3, unit_price_pence 40 and total_pence 120
    verification:
      method: new_test
      reference: tests/test_quote.py::test_quote_apple
  - id: AC-2
    given: a sku that is not on the price list
    when: quote is called with it
    then: it raises KeyError
    verification:
      method: new_test
      reference: tests/test_quote.py::test_unknown_sku
  - id: AC-3
    given: the result of quote("pear", 2)
    when: it is validated against contracts/quote.schema.json
    then: validation succeeds
    verification:
      method: new_test
      reference: tests/test_quote.py::test_matches_contract

size:
  estimate: S
  rationale: One small module, one schema file and one test module.
  files_estimate: 4

risk:
  level: low

dependencies:
  blocked_by: []

open_questions: []
