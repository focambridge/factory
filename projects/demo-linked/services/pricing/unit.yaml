kind: service
description: Quotes prices for products.
packaging: none
defaults:
  stack:
    - {kind: language, name: python, version: ">=3.10"}
    - {kind: tool, name: pytest}
  target:
    environment: local
  commands:
    test: python -m pytest -q
contracts:
  provides:
    - name: quote
      type: json-schema
      path: contracts/quote.schema.json
      description: The result of quote(sku, quantity).
