schema_version: "1.2"
id: CHK-1
sequence: 1
title: Total a basket using an injected quote function
description: >
  Add checkout.basket.total(lines, quote), which sums total_pence from the
  quote contract without importing the pricing service.
type: feature

goal:
  problem: >
    Checkout cannot total a basket, and must not depend on pricing's code to
    do so.
  outcome: >
    total(lines, quote) returns the sum of total_pence for each (sku, quantity)
    line, using whatever quote function it is given.

scope:
  in:
    - A checkout package with a total function
    - Unit tests using a fake quote function that follows the quote contract
  out:
    - Importing or calling the pricing package
    - Tax, discounts or delivery charges
  affected_paths:
    - checkout/__init__.py
    - checkout/basket.py
    - tests/test_basket.py

technical:
  interfaces:
    - kind: function
      name: checkout.basket.total
      signature: "(lines: list[tuple[str, int]], quote: Callable[[str, int], dict]) -> int"
      action: create
  constraints:
    - category: dependency
      statement: checkout must not import pricing; prices arrive only through the quote argument.

acceptance_criteria:
  - id: AC-1
    given: a fake quote function that charges 10 pence per item
    when: total([("a", 2), ("b", 3)], fake) is called
    then: it returns 50
    verification:
      method: new_test
      reference: tests/test_basket.py::test_total
  - id: AC-2
    given: an empty basket
    when: total([], fake) is called
    then: it returns 0
    verification:
      method: new_test
      reference: tests/test_basket.py::test_empty_basket

size:
  estimate: XS
  rationale: One function and its tests.
  files_estimate: 3

risk:
  level: low

dependencies:
  blocked_by: []

open_questions: []
