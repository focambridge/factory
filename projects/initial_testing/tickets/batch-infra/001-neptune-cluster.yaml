schema_version: "1.2"
id: GRAPH-101
sequence: 1
title: Provision a Neptune cluster for the dev environment with Terraform
description: >
  Add a Terraform module that creates a single-instance Neptune cluster in the
  dev VPC, reachable only from the private application subnets.
type: chore

goal:
  problem: >
    There is no graph database in dev, so graph features cannot be built or
    tested against real Neptune behaviour.
  outcome: >
    terraform plan for the dev environment shows one Neptune cluster and one
    instance in private subnets, with IAM authentication enabled.

scope:
  in:
    - A neptune module under infra/modules/neptune
    - Wiring the module into infra/envs/dev
    - A security group that allows port 8182 from the private application subnets only
  out:
    - Production or staging environments
    - Running terraform apply
    - Loading any data into the cluster (GRAPH-102)
  affected_paths:
    - infra/modules/neptune/
    - infra/envs/dev/main.tf
    - infra/envs/dev/variables.tf

technical:
  stack:
    - {kind: iac, name: terraform, version: "~> 1.7"}
    - {kind: library, name: hashicorp/aws, version: "~> 5.0"}
    - {kind: database, name: neptune, version: "1.3"}
  target:
    environment: aws
    region: eu-west-2
    account: dev
  components:
    - {type: aws_neptune_cluster, name: graph-dev, action: create}
    - {type: aws_neptune_cluster_instance, name: graph-dev-1, action: create}
    - {type: aws_neptune_subnet_group, name: graph-dev, action: create}
    - {type: aws_security_group, name: graph-dev-neptune, action: create}
    - {type: aws_vpc, name: dev, action: read}
  commands:
    validate: terraform -chdir=infra/envs/dev validate
    plan: terraform -chdir=infra/envs/dev plan -out=tfplan
    lint: tflint --chdir=infra/modules/neptune
  constraints:
    - category: security
      statement: The cluster must have iam_database_authentication_enabled = true and storage_encrypted = true.
    - category: cost
      statement: Use a single db.t4g.medium instance; no read replicas.
    - category: infrastructure
      statement: No public subnets and no 0.0.0.0/0 ingress rules.

acceptance_criteria:
  - id: AC-1
    given: the dev environment configuration
    when: terraform validate runs
    then: it exits 0 with no warnings
    verification:
      method: static_check
      reference: terraform -chdir=infra/envs/dev validate
  - id: AC-2
    given: the dev environment configuration and a clean state
    when: terraform plan runs
    then: >
      the plan adds exactly one aws_neptune_cluster, one aws_neptune_cluster_instance,
      one aws_neptune_subnet_group and one aws_security_group, and changes or destroys nothing
    verification:
      method: static_check
      reference: terraform -chdir=infra/envs/dev plan -out=tfplan
  - id: AC-3
    given: the generated plan
    when: the security group rules are inspected with terraform show -json
    then: the only ingress rule is TCP 8182 from the private application subnet CIDRs
    verification:
      method: static_check
      reference: terraform show -json tfplan

size:
  estimate: S
  rationale: One small module, one environment wiring change, no application code.
  files_estimate: 5

risk:
  level: medium
  notes: Creates billable AWS resources once applied; apply stays a human step.
  human_approval_required: true

dependencies:
  blocked_by: []

open_questions: []
