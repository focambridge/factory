schema_version: "1.1"
id: PAY-413
sequence: 3
title: Expose the dead-letter count as a metrics gauge
description: >
  Publish the number of dead-lettered webhook deliveries on the metrics
  endpoint so on-call staff can alert on it.
type: feature

goal:
  problem: >
    Dead-lettered deliveries are only visible by querying the database, so a
    rise in permanent failures goes unnoticed until merchants complain.
  outcome: >
    The metrics endpoint reports the current number of dead-lettered deliveries.

scope:
  in:
    - A gauge named webhook_dead_letter_count on the existing metrics endpoint
  out:
    - Alert rules and dashboards
    - A per-merchant breakdown of the metric
  affected_paths:
    - src/webhooks/metrics.py
    - tests/webhooks/

acceptance_criteria:
  - id: AC-1
    given: three rows in webhook_dead_letters
    when: the metrics endpoint is scraped
    then: webhook_dead_letter_count reports 3
    verification:
      method: new_test
      reference: tests/webhooks/test_metrics.py::test_dead_letter_gauge

size:
  estimate: XS
  rationale: One new gauge registration and one test.
  files_estimate: 2

risk:
  level: low

dependencies:
  blocked_by: [PAY-410]

open_questions: []
