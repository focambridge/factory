schema_version: "1.2"
id: PAY-512
sequence: 2
title: Retry failed webhook deliveries with exponential backoff
description: >
  Make the delivery worker retry transient failures on a backoff schedule and
  write deliveries that run out of retries to the dead-letter table.
type: feature

goal:
  problem: >
    Webhook deliveries that fail with a 5xx or a timeout are dropped after a
    single attempt, so merchants miss payment events during short outages.
  outcome: >
    Transient delivery failures are retried automatically, and deliveries that
    exhaust their retries are recorded in webhook_dead_letters.

context:
  parent: PAY-400
  links:
    - https://example.org/adr/0031-webhook-delivery-guarantees

scope:
  in:
    - Retry deliveries that fail with HTTP 5xx, 429 or a connection timeout
    - Exponential backoff schedule with jitter, configured in settings
    - Write deliveries that exhaust retries to webhook_dead_letters
  out:
    - Retrying 4xx responses other than 429
    - A UI for replaying dead-lettered deliveries (PAY-415)
    - Any change to the webhook payload or signature format
    - Per-merchant retry configuration
  affected_paths:
    - src/webhooks/delivery.py
    - src/webhooks/settings.py
    - tests/webhooks/
  protected_paths:
    - src/webhooks/signing.py

technical:
  stack:
    - {kind: language, name: python, version: ">=3.11"}
    - {kind: tool, name: pytest}
  target:
    environment: container
  components:
    - {type: postgres_table, name: webhook_dead_letters, action: modify}
  interfaces:
    - kind: function
      name: webhooks.delivery.backoff_schedule
      signature: "(base_seconds: int, max_attempts: int) -> list[float]"
      action: create
    - kind: function
      name: webhooks.delivery.handle_failure
      action: modify
  commands:
    test: pytest tests/webhooks
    lint: ruff check src/webhooks
  constraints:
    - category: compatibility
      statement: The webhook payload and signature headers must not change.
    - category: dependency
      statement: No new third-party packages; use the existing task scheduler.

acceptance_criteria:
  - id: AC-1
    given: a delivery attempt that fails with HTTP 503
    when: the delivery worker processes the failure
    then: the delivery is rescheduled after the first backoff interval
    verification:
      method: new_test
      reference: tests/webhooks/test_retry.py::test_5xx_is_rescheduled
  - id: AC-2
    given: a delivery attempt that fails with HTTP 400
    when: the delivery worker processes the failure
    then: the delivery is marked failed and is not rescheduled
    verification:
      method: new_test
      reference: tests/webhooks/test_retry.py::test_4xx_is_not_retried
  - id: AC-3
    given: a delivery that has failed on all 6 configured attempts
    when: the final attempt fails
    then: >
      exactly one row is written to webhook_dead_letters with the delivery id,
      last status code and attempt count
    verification:
      method: new_test
      reference: tests/webhooks/test_retry.py::test_exhausted_delivery_is_dead_lettered
  - id: AC-4
    given: WEBHOOK_RETRY_BASE_SECONDS=30 and WEBHOOK_RETRY_MAX_ATTEMPTS=6
    when: the retry schedule is computed
    then: the delays are 30, 60, 120, 240 and 480 seconds, each with at most 10% jitter
    verification:
      method: new_test
      reference: tests/webhooks/test_backoff.py::test_schedule
  - id: AC-5
    given: the existing webhook test suite
    when: the full suite runs
    then: every existing test passes without modification
    verification:
      method: existing_test
      reference: tests/webhooks/

size:
  estimate: M
  rationale: One worker change, one settings change and two new test modules.
  files_estimate: 5

risk:
  level: medium
  notes: Retries add outbound traffic during merchant outages; bounded by max attempts.
  human_approval_required: false

dependencies:
  blocked_by: [PAY-510]

open_questions: []
