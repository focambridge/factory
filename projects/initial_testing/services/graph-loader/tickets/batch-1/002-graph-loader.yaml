schema_version: "1.2"
id: GRAPH-102
sequence: 2
title: Load course prerequisites into Neptune from a local CSV
description: >
  A local Python command that reads a CSV of courses and prerequisites and
  writes them to Neptune as vertices and edges using Gremlin.
type: feature

goal:
  problem: >
    Course prerequisite data sits in spreadsheets, so nobody can query which
    courses depend on which without reading the files by hand.
  outcome: >
    Running the loader against a CSV leaves one course vertex per row and one
    requires edge per prerequisite in Neptune, and re-running it creates no duplicates.

scope:
  in:
    - A CLI command graph-load that takes a CSV path and a Neptune endpoint
    - Idempotent upserts of course vertices and requires edges
  out:
    - Any infrastructure change (GRAPH-101)
    - Scheduling or running the loader in AWS
    - Deleting vertices that are no longer in the CSV
  affected_paths:
    - src/graph_loader/
    - tests/graph_loader/
    - pyproject.toml

technical:
  stack:
    - {kind: language, name: python, version: ">=3.11"}
    - {kind: library, name: gremlinpython, version: "~=3.7"}
    - {kind: database, name: neptune, version: "1.3"}
    - {kind: query_language, name: gremlin}
    - {kind: tool, name: pytest}
  target:
    environment: local
    notes: Runs on a developer machine; connects to Neptune over an SSH tunnel.
  components:
    - {type: aws_neptune_cluster, name: graph-dev, action: read}
  interfaces:
    - kind: cli
      name: graph-load
      signature: "graph-load CSV_PATH --endpoint URL [--dry-run]"
      action: create
    - kind: function
      name: graph_loader.load.upsert_course
      signature: "(g: GraphTraversalSource, course_id: str, title: str) -> None"
      action: create
    - kind: function
      name: graph_loader.load.upsert_requires
      signature: "(g: GraphTraversalSource, course_id: str, prerequisite_id: str) -> None"
      action: create
  commands:
    test: pytest tests/graph_loader
    lint: ruff check src/graph_loader
  constraints:
    - category: security
      statement: Authenticate with IAM (SigV4); no passwords in code or config files.
    - category: dependency
      statement: gremlinpython is the only new runtime dependency.

acceptance_criteria:
  - id: AC-1
    given: a CSV with 3 courses and 2 prerequisite rows, and an empty graph
    when: graph-load runs against a Gremlin Server test container
    then: the graph holds exactly 3 course vertices and 2 requires edges
    verification:
      method: new_test
      reference: tests/graph_loader/test_load.py::test_loads_vertices_and_edges
  - id: AC-2
    given: the graph after AC-1
    when: graph-load runs again with the same CSV
    then: the graph still holds exactly 3 course vertices and 2 requires edges
    verification:
      method: new_test
      reference: tests/graph_loader/test_load.py::test_reload_is_idempotent
  - id: AC-3
    given: a CSV whose prerequisite references a course id not in the file
    when: graph-load runs
    then: it exits with code 2, names the missing id, and writes nothing
    verification:
      method: new_test
      reference: tests/graph_loader/test_load.py::test_unknown_prerequisite_rejected

size:
  estimate: M
  rationale: New package with a CLI, two upsert functions and a test module using a container.
  files_estimate: 6

risk:
  level: low

dependencies:
  blocked_by: [GRAPH-101]

open_questions: []
